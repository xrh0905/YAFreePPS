[package]
name = "yafreepps"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Event-driven PPS unlock with MIPPS isolation"

[dependencies]
libc = "0.2.180"
anyhow = "1.0.100"
log = "0.4.29"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
