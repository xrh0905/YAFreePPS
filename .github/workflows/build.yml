name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after tests pass
        type: boolean
        default: false
      release_tag:
        description: Release tag matching Cargo.toml (required when publishing)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: yafreepps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and release tag
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          tag=''
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH_RELEASE" = true ]; then
            [ -n "$MANUAL_TAG" ] || { echo 'release_tag is required'; exit 1; }
            tag="$MANUAL_TAG"
          fi
          python3 scripts/release_metadata.py --tag "$tag"
      - name: Install pinned Android NDK r27d
        run: |
          archive="$RUNNER_TEMP/android-ndk-r27d-linux.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r27d-linux.zip --output "$archive"
          echo "601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9  $archive" | sha256sum --check -
          unzip -q "$archive" -d "$RUNNER_TEMP/yafreepps-ndk"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/yafreepps-ndk/android-ndk-r27d" >> "$GITHUB_ENV"
      - name: CLI, packaging and WebUI tests
        run: |
          cargo build --locked
          python3 -m unittest discover -s tests -v
          node --test tests/webui.test.cjs
          sh -n module/action.sh module/service.sh module/customize.sh module/uninstall.sh
      - name: Rust checks and Android release build
        run: python3 build_android.py --ndk "$ANDROID_NDK_HOME"
      - name: Package source and checksums
        run: python3 scripts/release_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: YAFreePPS-arm64
          if-no-files-found: error
          path: |
            output/YAFreePPS-*.zip
            output/SHA256SUMS
            output/RELEASE_NOTES.md
  release:
    needs: android
    if: >-
      needs.android.outputs.release_tag != '' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YAFreePPS-arm64
          path: output
      - name: Verify release checksums
        working-directory: output
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.android.outputs.release_tag }}
          PRERELEASE: ${{ needs.android.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          args=(--target "$TARGET_SHA" --title "YAFreePPS $RELEASE_TAG" --notes-file output/RELEASE_NOTES.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          fi
          # An existing tag must point at exactly the tested commit.
          error_file=$(mktemp)
          if tagged_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>"$error_file"); then
            [ "$tagged_sha" = "$TARGET_SHA" ] || { echo 'Tag points at another commit'; exit 1; }
          elif ! grep -q 'HTTP 404' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
          rm -f "$error_file"
          # Existing releases are never overwritten by a rerun.
          gh release create "$RELEASE_TAG" "${args[@]}" output/YAFreePPS-*.zip output/SHA256SUMS

